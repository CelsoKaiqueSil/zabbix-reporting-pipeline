[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zabbix-reporting-pipeline"
version = "1.0.0"
description = "Pipeline demonstrativo e somente leitura para relatórios de monitoramento Zabbix."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<8", "ruff>=0.8,<1", "matplotlib>=3.8,<4"]

[project.scripts]
zabbix-report = "zabbix_reporting.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
